<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Administración | El Chambre</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/app.css">
</head>

<body>
    <main class="app-wrap">
        <header class="app-head"><a class="app-brand" href="../index.html">El Chambre</a>
            <nav class="app-nav"><a href="pedidos.html">Mis pedidos</a><a href="admin.html">Administración</a><a
                    href="../menu.html">Menú público</a><button class="btn-secondary" data-logout type="button">Cerrar
                    sesión</button></nav>
        </header>
        <h1>Panel de administración</h1>
        <p class="muted">Gestioná el catálogo y supervisá los pedidos de El Chambre.</p>
        <section class="panel">
            <div class="app-head">
                <h2 id="titulo-form-producto">Agregar producto</h2><button type="button" class="btn-secondary"
                    id="cargar-demo">Cargar catálogo inicial</button>
            </div>
            <form id="form-producto"><input type="hidden" name="id">
                <div class="grid">
                    <div><label for="nombre">Nombre</label><input id="nombre" name="nombre" required minlength="2"
                            maxlength="80"></div>
                    <div><label for="precio">Precio (USD)</label><input id="precio" name="precio" type="number"
                            min="0.01" max="9999" step="0.01" required></div>
                    <div><label for="categoria">Categoría</label><select id="categoria" name="categoria" required>
                            <option value="">Elegí una</option>
                            <option>Pan dulce</option>
                            <option>Postres</option>
                            <option>Café</option>
                            <option>Combos</option>
                            <option>Temporada</option>
                        </select></div>
                    <div><label for="descripcion">Descripción</label><input id="descripcion" name="descripcion"
                            maxlength="180"></div>
                </div>
                <p id="mensaje-producto" class="msg" role="status"></p>
                <div class="actions"><button type="submit">Guardar producto</button><button type="reset"
                        class="btn-secondary" id="cancelar-edicion">Limpiar</button></div>
            </form>
        </section>
        <section class="panel">
            <div class="app-head">
                <h2>Productos</h2><input id="buscar-productos" style="max-width:260px" placeholder="Buscar producto…">
            </div>
            <div id="lista-productos" class="grid"></div>
        </section>
        <section class="panel">
            <div class="app-head">
                <h2>Pedidos recibidos</h2><select id="filtro-estado" style="max-width:220px">
                    <option value="">Todos los estados</option>
                    <option>Pendiente</option>
                    <option>Preparando</option>
                    <option>Listo</option>
                    <option>Entregado</option>
                    <option>Cancelado</option>
                </select>
            </div>
            <p id="resumen" class="muted"></p>
            <div id="lista-admin-pedidos"></div>
        </section>
        <section class="panel">
            <h2>Consultas de contacto</h2>
            <p id="resumen-consultas" class="muted"></p>
            <div id="lista-consultas" class="grid"></div>
        </section>
        <script type="module" src="../js/admin.js"></script>
    </main>
</body>

</html>
